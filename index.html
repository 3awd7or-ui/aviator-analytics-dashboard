<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي Crash الحقيقي - Linebet Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 800px; }
        
        /* شريط السجل العلوي */
        .history-bar { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding: 5px; justify-content: center; }
        .history-pill { background: #161b22; border: 1px solid #30363d; padding: 5px 12px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; color: #10b981; }
        .history-pill.low { color: #ef4444; }

        /* شاشة اللعبة الرئيسية */
        .crash-screen {
            background: radial-gradient(circle, #1f2937 0%, #0d1117 100%);
            border-radius: 16px;
            height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid #30363d;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .plane-icon { font-size: 3.5rem; margin-bottom: 5px; transition: transform 0.2s ease; }
        .multiplier-display { font-size: 4.5rem; font-weight: 900; color: #10b981; letter-spacing: 1px; }
        .flight-status { margin-top: 8px; font-size: 1.1rem; font-weight: 600; color: #38bdf8; }

        /* الجدول السفلي */
        .table-box { background: #161b22; border-radius: 12px; padding: 15px; border: 1px solid #30363d; }
        .table-box h3 { font-size: 1rem; margin-bottom: 10px; color: #8b949e; border-bottom: 1px solid #30363d; padding-bottom: 6px; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { padding: 10px; border-bottom: 1px solid #21262d; font-size: 0.9rem; }
        th { color: #8b949e; font-weight: 500; }
        td { color: #c9d1d9; }
    </style>
</head>
<body>

    <div class="container">
        <!-- شريط السجل العلوي -->
        <div class="history-bar" id="history-bar">
            <div class="history-pill">--</div>
        </div>

        <!-- الشاشة الحية المتزامنة -->
        <div class="crash-screen">
            <div class="plane-icon" id="plane">✈️</div>
            <div class="multiplier-display" id="live-multiplier">1.00x</div>
            <div class="flight-status" id="game-status">في انتظار بدء الجولة...</div>
        </div>

        <!-- جدول السجل -->
        <div class="table-box">
            <h3>سجل الجولات المباشر</h3>
            <table>
                <thead>
                    <tr>
                        <th>رقم الجولة</th>
                        <th>مضاعف الانتهاء (Crash)</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody id="results-table">
                    <tr><td colspan="3">جاري المزامنة...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://aviator-live-data-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('game_results');

        const multiplierEl = document.getElementById('live-multiplier');
        const statusEl = document.getElementById('game-status');
        const planeEl = document.getElementById('plane');
        const historyBar = document.getElementById('history-bar');
        const tableBody = document.getElementById('results-table');

        // استقبال التحديثات الحية من قاعدة البيانات وتطبيقها فوراً
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                let resultsArray = Object.values(data).reverse();
                
                // تحديث الشريط العلوي
                historyBar.innerHTML = "";
                resultsArray.slice(0, 6).forEach(item => {
                    let m = parseFloat(item.multiplier);
                    let pill = document.createElement('div');
                    pill.className = `history-pill ${m < 1.5 ? 'low' : ''}`;
                    pill.innerText = m.toFixed(2) + 'x';
                    historyBar.appendChild(pill);
                });

                // محاكاة حركة الطائرة وتصاعد المضاعف متزامناً مع أحدث جولة قادمة من البايثون
                if (resultsArray.length > 0) {
                    let latestTarget = parseFloat(resultsArray[0].multiplier);
                    runCrashRound(latestTarget);
                }

                // تحديث الجدول الكامل
                tableBody.innerHTML = "";
                resultsArray.forEach(item => {
                    let m = parseFloat(item.multiplier);
                    let isLow = m < 1.5;
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.round || '#--'}</td>
                        <td style="color: ${isLow ? '#ef4444' : '#10b981'}; font-weight: bold;">${m.toFixed(2)}x</td>
                        <td>${isLow ? 'مبكر 💥' : 'مرتفع 🚀'}</td>
                    `;
                    tableBody.appendChild(tr);
                });
            }
        });

        let currentAnimation = null;
        function runCrashRound(targetMultiplier) {
            if (currentAnimation) clearInterval(currentAnimation);

            let currentVal = 1.00;
            multiplierEl.style.color = "#10b981";
            statusEl.style.color = "#38bdf8";
            statusEl.innerText = "الطائرة تحلق الآن... 🚀";
            planeEl.style.transform = "scale(1.2) translateY(-10px)";

            currentAnimation = setInterval(() => {
                currentVal += 0.03 * currentVal; // سرعة الصعود المتسارعة
                if (currentVal >= targetMultiplier) {
                    clearInterval(currentAnimation);
                    multiplierEl.innerText = targetMultiplier.toFixed(2) + 'x';
                    multiplierEl.style.color = "#ef4444";
                    statusEl.style.color = "#ef4444";
                    statusEl.innerText = "💥 طارت بعيداً (Crashed)!";
                    planeEl.style.transform = "scale(0.8) translateY(20px)";
                } else {
                    multiplierEl.innerText = currentVal.toFixed(2) + 'x';
                }
            }, 80);
        }
    </script>
</body>
</html>
