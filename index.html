<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤشر النتائج الحية - Crash Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 10px;
        }
        header h1 {
            font-size: 2rem;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .container {
            width: 100%;
            max-width: 900px;
        }
        .live-screen {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            border: 2px solid #334155;
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.15);
            margin-bottom: 25px;
        }
        .multiplier-display {
            font-size: 4rem;
            font-weight: 900;
            color: #34d399;
            margin: 10px 0;
        }
        .flight-status {
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: 500;
        }
        .table-container {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
        }
        .table-container h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #e2e8f0;
            border-bottom: 2px solid #334155;
            padding-bottom: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #334155;
            font-size: 0.95rem;
        }
        th { color: #38bdf8; font-weight: 500; }
        td { color: #cbd5e1; }
        .badge {
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 700;
        }
        .badge.low {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
        }
        .api-status {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #f59e0b;
        }
    </style>
</head>
<body>

    <header>
        <h1>متابعة نتائج لعبة الطائرة ✈️</h1>
        <p>لوحة بيانات حية قابلة للربط مع مصادر البيانات الخارجية</p>
    </header>

    <div class="container">
        <div class="live-screen">
            <h3>حالة الجولة الحية</h3>
            <div class="multiplier-display" id="live-multiplier">1.00x</div>
            <div class="flight-status" id="flight-timer">جاري مزامنة البيانات...</div>
            <div class="api-status" id="api-status-text">وضع الاتصال: محاكاة حية (جاهز للربط بـ API خارجي)</div>
        </div>

        <div class="table-container">
            <h2>سجل الجولات الأخيرة المحدث</h2>
            <table>
                <thead>
                    <tr>
                        <th>رقم الجولة</th>
                        <th>المضاعف النهائي</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody id="live-table-body">
                    <!-- سيتم تعبئتها ديناميكياً -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // دالة لجلب النتائج الحية من API خارجي (في حال قمت بإنشاء خادم وسيط مستقبلاً)
        async function fetchRealData() {
            try {
                // استبدل الرابط أدناه برابط الـ API الخاص بك عندما تقوم ببرمجته
                // const response = await fetch('https://your-backend-api.com/results');
                // const data = await response.json();
                
                // كمثال افتراضي للربط البرمجي:
                updateDashboardWithData(2.15, [
                    { round: "#4592", multiplier: "2.15x", status: "متوسط" },
                    { round: "#4591", multiplier: "1.02x", status: "منخفض جداً" },
                    { round: "#4590", multiplier: "4.50x", status: "مرتفع جداً" }
                ]);
            } catch (error) {
                document.getElementById('api-status-text').innerText = "خطأ في الاتصال بالخادم الخارجي، يتم استخدام الوضع المحلي.";
            }
        }

        function updateDashboardWithData(currentMult, historyList) {
            document.getElementById('live-multiplier').innerText = currentMult.toFixed(2) + 'x';
            document.getElementById('flight-timer').innerText = "تم استلام التحديث المباشر بنجاح";
            
            const tbody = document.getElementById('live-table-body');
            tbody.innerHTML = "";
            
            historyList.forEach(item => {
                let isLow = parseFloat(item.multiplier) < 1.5;
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.round}</td>
                    <td><span class="badge ${isLow ? 'low' : ''}">${item.multiplier}</span></td>
                    <td>${item.status}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // تنفيذ التحديث عند فتح الصفحة ثم كل 5 ثوانٍ
        fetchRealData();
        setInterval(fetchRealData, 5000);
    </script>
</body>
</html>
