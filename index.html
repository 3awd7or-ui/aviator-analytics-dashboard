<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي وتحليل Crash المباشر ✈️</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        header { text-align: center; margin-bottom: 25px; margin-top: 10px; }
        header h1 { font-size: 2rem; color: #38bdf8; margin-bottom: 5px; }
        header p { color: #94a3b8; font-size: 0.95rem; }
        .container { width: 100%; max-width: 900px; }
        
        /* شاشة الطائرة الكلاسيكية */
        .game-screen {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            border: 2px solid #334155;
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.15);
            margin-bottom: 25px;
            position: relative;
        }
        .plane-icon { font-size: 3rem; margin-bottom: 10px; display: inline-block; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .multiplier-display { font-size: 4.5rem; font-weight: 900; color: #34d399; margin: 5px 0; text-shadow: 0 0 20px rgba(52, 211, 153, 0.4); }
        .flight-status { font-size: 1.1rem; color: #38bdf8; font-weight: 500; }
        
        .table-container { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
        .table-container h2 { font-size: 1.2rem; margin-bottom: 15px; color: #e2e8f0; border-bottom: 2px solid #334155; padding-bottom: 8px; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; font-size: 0.95rem; }
        th { color: #38bdf8; font-weight: 500; }
        td { color: #cbd5e1; }
        .badge { background: rgba(52, 211, 153, 0.15); color: #34d399; padding: 4px 10px; border-radius: 20px; font-weight: 700; }
        .badge.low { background: rgba(248, 113, 113, 0.15); color: #f87171; }
    </style>
</head>
<body>

    <header>
        <h1>محاكي حركة الطائرة المباشر ✈️</h1>
        <p>تتبع تماثل اللحظات الحية ونقاط السقوط (Crash)</p>
    </header>

    <div class="container">
        <!-- الشاشة الحية -->
        <div class="game-screen">
            <div class="plane-icon">✈️</div>
            <div class="multiplier-display" id="live-multiplier">1.00x</div>
            <div class="flight-status" id="flight-status-text">جاري انتظار الجولة القادمة...</div>
        </div>

        <!-- الجدول -->
        <div class="table-container">
            <h2>سجل جولات الكراش الأخيرة</h2>
            <table>
                <thead>
                    <tr>
                        <th>رقم الجولة</th>
                        <th>مضاعف السقوط (Crash)</th>
                        <th>التقييم</th>
                    </tr>
                </thead>
                <tbody id="realtime-results">
                    <tr><td colspan="3">جاري مزامنة البيانات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://aviator-live-data-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('game_results');

        let currentVal = 1.00;
        let isRunning = false;

        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                let resultsArray = Object.values(data).reverse();
                
                // تحديث الجدول
                const tableBody = document.getElementById('realtime-results');
                tableBody.innerHTML = "";
                resultsArray.forEach(item => {
                    let mult = parseFloat(item.multiplier);
                    let isLow = mult < 1.5;
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.round || '---'}</td>
                        <td><span class="badge ${isLow ? 'low' : ''}">${mult.toFixed(2)}x</span></td>
                        <td>${isLow ? 'سقوط مبكر 💥' : 'مرتفع 🚀'}</td>
                    `;
                    tableBody.appendChild(tr);
                });
            }
        });

        // محاكاة بصرية لحركة صعود الطائرة في الواجهة بشكل مطابق للعبة الحقيقية
        function simulateFlightAnimation() {
            let targetCrash = (Math.random() * 3 + 1.1).toFixed(2);
            currentVal = 1.00;
            isRunning = true;
            
            document.getElementById('flight-status-text').innerText = "الطائرة تحلق الآن... 🚀";
            document.getElementById('live-multiplier').style.color = "#34d399";

            let timer = setInterval(() => {
                currentVal += 0.04 * currentVal; // حركة تصاعدية مشابهة للكراش
                if (currentVal >= targetCrash) {
                    clearInterval(timer);
                    document.getElementById('live-multiplier').innerText = parseFloat(targetCrash).toFixed(2) + 'x';
                    document.getElementById('live-multiplier').style.color = "#f87171";
                    document.getElementById('flight-status-text').innerText = "💥 طارت بعيداً (Crashed)!";
                    
                    setTimeout(() => {
                        simulateFlightAnimation();
                    }, 4000); // استراحة بين الجولات
                } else {
                    document.getElementById('live-multiplier').innerText = currentVal.toFixed(2) + 'x';
                }
            }, 100);
        }

        setTimeout(simulateFlightAnimation, 1500);
    </script>
</body>
</html>
