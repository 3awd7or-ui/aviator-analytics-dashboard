<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البث المباشر لنتائج الطائرة - Crash Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- استدعاء مكتبة Firebase للاتصال المباشر بقاعدة البيانات -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 10px;
        }
        header h1 {
            font-size: 2rem;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .container {
            width: 100%;
            max-width: 900px;
        }
        .live-screen {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            border: 2px solid #334155;
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.15);
            margin-bottom: 25px;
        }
        .multiplier-display {
            font-size: 4rem;
            font-weight: 900;
            color: #34d399;
            margin: 10px 0;
        }
        .flight-status {
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: 500;
        }
        .table-container {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
        }
        .table-container h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #e2e8f0;
            border-bottom: 2px solid #334155;
            padding-bottom: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #334155;
            font-size: 0.95rem;
        }
        th { color: #38bdf8; font-weight: 500; }
        td { color: #cbd5e1; }
        .badge {
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 700;
        }
        .badge.low {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
        }
    </style>
</head>
<body>

    <header>
        <h1>البث المباشر لنتائج الطائرة ✈️</h1>
        <p>لوحة بيانات حية متصلة بقاعدة البيانات السحابية</p>
    </header>

    <div class="container">
        <div class="live-screen">
            <h3>آخر مضاعف تم تسجيله</h3>
            <div class="multiplier-display" id="current-multiplier">--</div>
            <div class="flight-status" id="connection-status">جاري الاتصال بقاعدة البيانات الحية...</div>
        </div>

        <div class="table-container">
            <h2>سجل النتائج الحية المباشرة</h2>
            <table>
                <thead>
                    <tr>
                        <th>رقم الجولة</th>
                        <th>المضاعف النهائي</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody id="realtime-results">
                    <tr><td colspan="3">جاري جلب البيانات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // إعدادات الاتصال بقاعدة بيانات Firebase الخاصة بك[cite: 3]
        const firebaseConfig = {
            databaseURL: "https://aviator-live-data-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);

        const dbRef = firebase.database().ref('game_results');
        const statusEl = document.getElementById('connection-status');
        const currentMultEl = document.getElementById('current-multiplier');
        const tableBody = document.getElementById('realtime-results');

        // الاستماع المباشر للتحديثات الفورية في قاعدة البيانات
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                statusEl.innerText = "متصل بالبث المباشر بنجاح ✅";
                tableBody.innerHTML = "";
                
                let resultsArray = Object.values(data).reverse(); // أحدث النتائج في الأعلى
                
                if (resultsArray.length > 0) {
                    currentMultEl.innerText = resultsArray[0].multiplier + 'x';
                    if (parseFloat(resultsArray[0].multiplier) < 1.5) {
                        currentMultEl.style.color = '#f87171';
                    } else {
                        currentMultEl.style.color = '#34d399';
                    }
                }

                resultsArray.forEach(item => {
                    let isLow = parseFloat(item.multiplier) < 1.5;
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.round || '---'}</td>
                        <td><span class="badge ${isLow ? 'low' : ''}">${item.multiplier}x</span></td>
                        <td>${isLow ? 'منخفض' : 'مرتفع/جيد'}</td>
                    `;
                    tableBody.appendChild(tr);
                });
            } else {
                statusEl.innerText = "لا توجد بيانات مسجلة في قاعدة البيانات حالياً.";
            }
        }, (error) => {
            statusEl.innerText = "فشل الاتصال بقاعدة البيانات ❌";
        });
    </script>
</body>
</html>
